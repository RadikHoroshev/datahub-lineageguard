name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic requests
          # Skip heavy optional deps (datahub docker, streamlit) for unit CI
      - name: Unit tests
        run: pytest tests/test_agent.py -q
